[package]
name = "tempus-ddb"
version = "0.6.0"
description = "Fail-closed policy gate for AI agent actions: signed policies, single-use permits, receipts"
license = "MIT"
repository = "https://github.com/tempus-protocol/tempus-ddb"
homepage = "https://tempus-protocol.github.io/tempus-ddb/"
documentation = "https://tempus-protocol.github.io/tempus-ddb/docs.html"
authors = ["Tempus DDB Contributors"]
readme = "README.md"
keywords = ["ai-agents", "mcp", "policy", "security", "audit"]
categories = ["cryptography", "authentication", "command-line-utilities"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "_tempus_ddb"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"

# The gate (SQLite, signing keys, Python bindings, dev CLI). None of this is in the
# browser verifier, which is the wasm32 build of the same crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.4", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.24", features = ["bundled"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.89"
js-sys = "0.3"

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
pyo3-build-config = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
