name: CI

permissions:
  contents: read

# Superseded PR pushes are cancelled. Pushes to main are not: every commit on
# main gets a finished run, and a re-run of an older main run cannot cancel
# the run for the current head (that is how 72a3ddf ended up without CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, desarrollo]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run Cargo Audit
        run: cargo audit

      - name: Run Rust tests
        env:
          RUST_BACKTRACE: 1
        run: cargo test --all-targets --verbose -- --nocapture

  wasm-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The CLI version must match the wasm-bindgen crate pinned in Cargo.lock;
      # the build script checks and fails early otherwise.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build the browser verifier
        run: bash scripts/build_wasm_verifier.sh

      - name: Run the verifier against the conformance fixtures
        run: node scripts/test_wasm_verifier.mjs

      - name: Validate the site
        run: node scripts/validate_site.mjs

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # rust-toolchain.toml pins the toolchain. Install it here, once, so the
      # maturin build that pip starts does not race rustup's auto-install
      # (seen as "detected conflict: 'bin/cargo-clippy'" on macOS and Linux).
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e .[dev]
          python -m pip install bandit uv
          # The HTTP, Slack and payment executors are a separate, unpublished
          # distribution; --no-deps keeps the develop build of tempus-ddb above.
          python -m pip install --no-deps -e contrib/executors

      - name: Check uv.lock is up to date
        if: runner.os == 'Linux'
        run: |
          python -m pip install uv
          uv lock --check

      - name: Run Bandit
        run: bandit -r python/tempus_ddb/ contrib/executors/tempus_executors/

      # Audit the locked project and dev dependencies from an isolated
      # pip-audit, so the tool's own dependencies and packages preinstalled
      # on the runner are not part of the result.
      - name: Run pip-audit
        shell: bash
        run: |
          python -m uv --quiet export --frozen --extra dev --no-emit-project --no-header --no-annotate --prune pip-audit -o requirements-audit.txt
          # filelock's fix for CVE-2026-112909 / CVE-2026-112910 (4.2.1) requires Python
          # 3.11; no release that supports 3.10 contains it. filelock is development
          # tooling pulled in by pip-audit, never part of the published wheel, so on 3.10
          # those two advisories are acknowledged rather than fixable. Drop this when
          # 3.10 leaves the matrix.
          IGNORE=()
          if python -c 'import sys; sys.exit(0 if sys.version_info < (3, 11) else 1)'; then
            IGNORE=(--ignore-vuln CVE-2026-112909 --ignore-vuln CVE-2026-112910)
          fi
          # `python/` is a project directory, so pass the interpreter path explicitly.
          python -m uv tool run --python "$(python -c 'import sys; print(sys.executable)')" pip-audit --disable-pip "${IGNORE[@]}" -r requirements-audit.txt
          python -c "import pathlib; pathlib.Path('requirements-audit.txt').unlink(missing_ok=True)"

      - name: Run Ruff
        run: ruff check .

      - name: Validate SPDX SBOM generation
        run: |
          python scripts/generate_sbom.py --version 0.6.0-ci --output artifacts/tempus-ddb.spdx.json
          python -c "import json; d=json.load(open('artifacts/tempus-ddb.spdx.json', encoding='utf-8')); assert d['spdxVersion']=='SPDX-2.3' and d['packages']"

      - name: Run Python tests
        run: python -m pytest tests/ -vv --tb=long -ra

      - name: Run contrib executor tests
        run: python -m pytest contrib/executors/tests -vv --tb=long -ra

      - name: Test CLI basic commands
        run: |
          tempus --version
          tempus --help
          tempus-github-executor --help
          # Provided by contrib/executors, not by the tempus-ddb wheel.
          tempus-http-executor --help
          tempus-slack-executor --help
          tempus-payment-executor --help

      - name: Smoke test examples
        run: |
          python examples/full_agent_flow.py
