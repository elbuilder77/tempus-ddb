name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.5.0)'
        required: false
        default: 'v0.5.0'

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name || 'v0.5.0' }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name || 'v0.5.0' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, sdist]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Generate SPDX SBOM
        run: >-
          python scripts/generate_sbom.py
          --version "${{ env.RELEASE_TAG }}"
          --output "sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/*
          sbom-path: sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json
      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
      - name: Upload SBOM to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Publish to crates.io
        if: steps.version.outputs.tag == env.RELEASE_TAG
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish
          else
            echo "CRATES_IO_TOKEN is not configured; skipping crates.io publish."
          fi

      # Publish to PyPI using Trusted Publishing (OIDC) or PYPI_API_TOKEN secret
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}