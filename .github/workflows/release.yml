name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.5.2)'
        required: false
        default: 'v0.5.2'

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name || 'v0.5.2' }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name || 'v0.5.2' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@f688e17dbba0d2d385624733c7f960f2523cb7a5 # v1.45.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@f688e17dbba0d2d385624733c7f960f2523cb7a5 # v1.45.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  test-wheels:
    name: Test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build]
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@cc203385981b70ca67e1ab38864c36ff8d29780e # v4.1.9
        with:
          pattern: wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true
      - name: Install wheel and verify import and tests
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import tempus_ddb; print('tempus_ddb version:', tempus_ddb.__version__)"
          pip install pytest pytest-asyncio
          pytest tests/ -p no:cacheprovider

  cargo-test:
    name: Run Cargo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run Cargo Test
        run: cargo test --all-targets --verbose

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, sdist, test-wheels, cargo-test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1ab38864c36ff8d29780e # v4.1.9
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@cc203385981b70ca67e1ab38864c36ff8d29780e # v4.1.9
        with:
          name: sdist
          path: dist
      - name: Generate SPDX SBOM
        run: >-
          python scripts/generate_sbom.py
          --version "${{ env.RELEASE_TAG }}"
          --output "sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@c074443f1a5fb4aee8390470235227a49f457a51 # v2.2.3
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest-sbom@2e25287f34149fa8178822998a44fb6b999dbf86 # v2.2.3
        with:
          subject-path: dist/*
          sbom-path: sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json
      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.7.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
      - name: Upload SBOM to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.7.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Publish to crates.io
        if: steps.version.outputs.tag == env.RELEASE_TAG
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish
          else
            echo "CRATES_IO_TOKEN is not configured; skipping crates.io publish."
          fi

      # Publish to PyPI using Trusted Publishing (OIDC) or PYPI_API_TOKEN secret
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}