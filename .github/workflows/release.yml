name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.5.3)'
        required: false
        default: 'v0.5.3'

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name || 'v0.5.3' }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name || 'v0.5.3' }}
  cancel-in-progress: false

# Every checkout pins `ref` to the release tag so a manual re-run builds exactly
# the tagged source instead of the branch the workflow was dispatched from.
# Action SHAs must resolve to real upstream tags; verify with
# `gh api repos/<owner>/<action>/commits/<sha>` before changing them.
jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  test-wheels:
    name: Test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build]
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true
      - name: Install wheel and verify import and tests
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import tempus_ddb; print('tempus_ddb version:', tempus_ddb.__version__)"
          pip install pytest pytest-asyncio
          pytest tests/ -p no:cacheprovider

  cargo-test:
    name: Run Cargo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run Cargo Test
        run: cargo test --all-targets --verbose

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, sdist, test-wheels, cargo-test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist
      - name: Generate SPDX SBOM
        run: >-
          python scripts/generate_sbom.py
          --version "${{ env.RELEASE_TAG }}"
          --output "sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: dist/*
          sbom-path: sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json
      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
      - name: Upload SBOM to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: sbom/tempus-ddb-${{ env.RELEASE_TAG }}.spdx.json
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      # PyPI Trusted Publishing (OIDC): no API token; the PyPI project trusts
      # this repository's release.yml workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  # Separate job so a crates.io failure (e.g. an expired token) never blocks the
  # PyPI publication above and still shows up as a failed job.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Check Cargo.toml version matches release tag
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish to crates.io
        if: steps.version.outputs.tag == env.RELEASE_TAG
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --locked
          else
            echo "CARGO_API_TOKEN is not configured; skipping crates.io publish."
          fi
